<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>Rustの小さな教室</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap');
:root{font-family:Manrope,'Noto Sans JP',sans-serif;color:#ecedf3;background:#10131d;font-synthesis:none;text-rendering:optimizeLegibility;--muted:#9b9eae;--line:#2c3040;--panel:#181c28;--soft:#222735;--mint:#a6f1ce;--purple:#c4b5fd;--red:#ff9eaa}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 65% -5%,#20283b 0,transparent 45%),#10131d}.app{max-width:1440px;margin:auto;padding:24px 30px 36px}.topbar{height:58px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:16px}.brand{display:flex;align-items:center;gap:12px;font-weight:800;letter-spacing:-.03em}.brand-icon{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;background:#a6f1ce;color:#17221d;font-family:'DM Mono',monospace;font-size:18px}.brand span small{display:block;color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.03em;margin-top:2px}.top-right{display:flex;align-items:center;gap:16px;color:var(--muted);font-size:12px}.streak{color:var(--mint);font-weight:700}.layout{display:grid;grid-template-columns:225px minmax(360px,1fr) 285px;gap:24px;padding-top:26px;align-items:start}.sidebar,.lesson-card,.guide-card{background:#151923;border:1px solid var(--line);border-radius:15px}.sidebar{padding:17px 12px;position:sticky;top:18px}.side-label{font-size:10px;color:#777d90;font-weight:800;letter-spacing:.12em;padding:4px 10px 12px}.lesson-list{display:grid;gap:5px}.lesson-link{width:100%;border:0;color:#adb1c0;background:transparent;text-align:left;padding:10px;border-radius:9px;font:inherit;display:flex;align-items:center;gap:10px;cursor:pointer}.lesson-link:hover{background:#202431}.lesson-link.active{background:#26352f;color:var(--mint)}.lesson-link.done .step-no{background:#a6f1ce;color:#17221d;border-color:#a6f1ce}.step-no{width:23px;height:23px;border:1px solid #424756;border-radius:50%;display:grid;place-items:center;font-size:11px;font-family:'DM Mono',monospace;flex:none}.lesson-link.active .step-no{border-color:var(--mint)}.lesson-name{font-size:12px;font-weight:650}.side-progress{margin:18px 8px 2px;padding-top:14px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.progress-text{display:flex;justify-content:space-between;margin-bottom:8px}.progress-rail{height:5px;background:#292e3b;border-radius:10px;overflow:hidden}.progress-fill{height:100%;width:0;background:var(--mint);transition:width .3s}.main{min-width:0}.eyebrow{font-size:11px;color:var(--mint);font-weight:800;letter-spacing:.13em;text-transform:uppercase;margin:5px 0 9px}.headline{font-size:clamp(25px,3vw,35px);line-height:1.25;letter-spacing:-.045em;margin:0 0 9px}.intro{color:#b6b9c7;font-size:14px;line-height:1.85;margin:0 0 21px}.concept{display:flex;align-items:flex-start;gap:12px;padding:14px 15px;border:1px solid #3c4651;background:#18221f;border-radius:11px;color:#d8e8df;margin-bottom:20px;font-size:13px;line-height:1.75}.concept-icon{width:22px;height:22px;border-radius:7px;background:#a6f1ce;color:#16221c;display:grid;place-items:center;flex:none;font-size:13px;font-weight:800}.concept code,.copy code{font-family:'DM Mono',monospace;color:#c5f5dc;background:#222e29;padding:2px 5px;border-radius:4px;font-size:.95em}.editor-head{display:flex;justify-content:space-between;align-items:center;padding:0 2px 9px}.section-title{font-size:12px;font-weight:800;letter-spacing:.04em}.keyhint{font-size:10px;color:#83889a}.editor{border:1px solid #373c4d;border-radius:12px;overflow:hidden;background:#11141e}.editor-top{height:39px;display:flex;align-items:center;justify-content:space-between;padding:0 13px;background:#1c202c;border-bottom:1px solid #303545;color:#aeb2c1;font-size:11px}.file-mark{display:flex;align-items:center;gap:8px}.rust-mark{color:#f4a77e;font-family:'DM Mono',monospace;font-weight:700}.editor-actions{display:flex;gap:10px}.mini{border:0;background:transparent;color:#aeb2c1;font:inherit;font-size:11px;cursor:pointer;padding:4px}.mini:hover{color:#fff}.codearea{display:grid;grid-template-columns:42px 1fr;min-height:236px}.gutter{padding:15px 10px 15px 0;text-align:right;color:#646a7c;font:12px/1.75 'DM Mono',monospace;white-space:pre;user-select:none}.code{width:100%;min-height:236px;resize:vertical;outline:0;border:0;background:transparent;color:#e3e6f1;padding:15px 14px 15px 0;font:13px/1.75 'DM Mono','Noto Sans JP',monospace;tab-size:4;white-space:pre;overflow:auto;caret-color:var(--mint)}.editor-footer{height:38px;border-top:1px solid #2b3040;display:flex;align-items:center;justify-content:space-between;padding:0 12px;color:#818698;font-size:10px}.run-btn{border:0;border-radius:8px;padding:9px 15px;background:var(--mint);color:#16251d;font:inherit;font-size:12px;font-weight:800;cursor:pointer;display:flex;gap:8px;align-items:center;box-shadow:0 2px 0 #5c9b7d}.run-btn:hover{filter:brightness(1.05);transform:translateY(-1px)}.run-btn:disabled{opacity:.55;cursor:wait;transform:none}.console{margin-top:14px;border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#131620}.console-head{height:37px;padding:0 13px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font-size:11px;color:#aeb2c1}.console-state{display:flex;align-items:center;gap:7px;color:#858b9d}.state-dot{width:7px;height:7px;border-radius:50%;background:#62687b}.console-body{min-height:76px;padding:13px 14px;font:12px/1.7 'DM Mono','Noto Sans JP',monospace;color:#d6dae7;white-space:pre-wrap;overflow-wrap:anywhere}.console-body.placeholder{font-family:Manrope,'Noto Sans JP',sans-serif;color:#797f91;font-size:11px}.console-body.error{color:#ffabb2}.console-body.success{color:#b9f2d2}.lesson-nav{display:flex;justify-content:space-between;gap:12px;margin-top:19px}.nav-btn{padding:10px 14px;border:1px solid #373c4d;background:#1a1e29;color:#dfe1ea;border-radius:9px;font:inherit;font-size:12px;cursor:pointer}.nav-btn:hover:not(:disabled){border-color:#737a8c}.nav-btn:disabled{opacity:.4;cursor:default}.nav-btn.next{background:#c4b5fd;color:#201b31;border-color:#c4b5fd;font-weight:800}.rightcol{display:grid;gap:13px}.guide-card{padding:17px}.guide-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;margin-bottom:11px}.guide-symbol{color:var(--purple);font-size:16px}.guide-card p{margin:0;color:#b0b4c2;font-size:12px;line-height:1.8}.task{border-color:#3b3a4f;background:linear-gradient(150deg,#211f31,#171923)}.task .guide-symbol{color:#d0bfff}.goal{margin-top:12px!important;padding:10px 11px;background:#13151e;border-radius:8px;color:#ddd9f1!important;font-size:11px!important}.hint-btn{margin-top:10px;padding:0;border:0;background:none;color:#c4b5fd;font:inherit;font-size:11px;cursor:pointer}.hint-text{display:none;margin-top:10px;padding:10px;border-left:2px solid #9b82ea;background:#1b1a28;border-radius:0 7px 7px 0;color:#dad4ee;font:11px/1.8 'DM Mono','Noto Sans JP',monospace;white-space:pre-wrap}.hint-text.show{display:block}.privacy{font-size:10px!important;color:#84899a!important}.reset{width:100%;border:1px solid var(--line);border-radius:9px;background:transparent;color:#8f94a4;padding:9px;font:inherit;font-size:11px;cursor:pointer}.reset:hover{color:#ddd}.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,15px);opacity:0;pointer-events:none;padding:10px 15px;border:1px solid #454b5b;border-radius:9px;background:#222735;color:#eee;font-size:12px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:1100px){.layout{grid-template-columns:190px minmax(330px,1fr);}.rightcol{grid-column:2;grid-template-columns:1fr 1fr}.privacy-card{grid-column:span 2}.sidebar{grid-row:span 2}}
@media(max-width:700px){.app{padding:13px 13px 25px}.topbar{height:49px}.brand{font-size:14px}.brand-icon{width:30px;height:30px}.top-right{gap:8px;font-size:10px}.layout{display:flex;flex-direction:column;gap:16px;padding-top:17px}.sidebar{position:static;width:100%;padding:10px}.side-label,.side-progress{display:none}.lesson-list{display:flex;overflow:auto;gap:6px}.lesson-link{width:auto;min-width:40px;padding:7px 8px;justify-content:center}.lesson-name{display:none}.rightcol{width:100%;display:flex;flex-direction:column}.main{width:100%}.headline{font-size:26px}.intro{font-size:13px}.keyhint{display:none}.codearea,.code{min-height:215px}.rightcol .guide-card:not(.privacy-card){width:100%}.privacy-card{width:100%}.nav-btn{font-size:11px;padding:9px 10px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-icon">R</div><span>Rustの小さな教室<small>ゼロからはじめるハンズオン</small></span></div>
    <div class="top-right"><span class="streak">✦ 自分のペースでOK</span><span id="topProgress">0 / 6 完了</span></div>
  </header>
  <div class="layout">
    <nav class="sidebar" aria-label="レッスン一覧">
      <div class="side-label">はじめてのRust</div><div class="lesson-list" id="lessonList"></div>
      <div class="side-progress"><div class="progress-text"><span>学習の進み具合</span><span id="sideCount">0 / 6</span></div><div class="progress-rail"><div class="progress-fill" id="progressFill"></div></div></div>
    </nav>
    <main class="main">
      <div class="eyebrow" id="eyebrow">LESSON 01 · はじめの一歩</div>
      <h1 class="headline" id="headline"></h1>
      <p class="intro" id="intro"></p>
      <div class="concept"><div class="concept-icon">i</div><div id="concept"></div></div>
      <div class="editor-head"><span class="section-title">コードを書いてみよう</span><span class="keyhint">⌘ / Ctrl + Enter で実行</span></div>
      <section class="editor" aria-label="Rustコードエディター">
        <div class="editor-top"><span class="file-mark"><span class="rust-mark">⌘</span> main.rs</span><div class="editor-actions"><button class="mini" id="copyBtn">コピー</button><button class="mini" id="resetCodeBtn">コードを戻す</button></div></div>
        <div class="codearea"><div class="gutter" id="gutter">1</div><textarea class="code" id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" aria-label="Rustコード"></textarea></div>
        <div class="editor-footer"><span>Rust · Stable</span><button class="run-btn" id="runBtn"><span>▶</span> 実行して確認</button></div>
      </section>
      <section class="console" aria-live="polite"><div class="console-head"><span>実行結果</span><span class="console-state"><span class="state-dot" id="stateDot"></span><span id="stateText">まだ実行していません</span></span></div><div class="console-body placeholder" id="output">ここにプログラムの出力やエラーが表示されます。</div></section>
      <div class="lesson-nav"><button class="nav-btn" id="prevBtn">← 前のレッスン</button><button class="nav-btn next" id="nextBtn">次のレッスン →</button></div>
    </main>
    <aside class="rightcol">
      <section class="guide-card task"><div class="guide-title"><span class="guide-symbol">✳</span>今回やること</div><p id="taskText"></p><p class="goal" id="goalText"></p><button class="hint-btn" id="hintBtn">ヒントを見る　＋</button><div class="hint-text" id="hintText"></div></section>
      <section class="guide-card"><div class="guide-title"><span class="guide-symbol">↗</span>わかったこと</div><p id="takeaway"></p></section>
      <section class="guide-card privacy-card"><div class="guide-title"><span class="guide-symbol">◎</span>コードの実行について</div><p class="privacy">実行すると、入力したコードがRust公式Playground（play.rust-lang.org）に送られます。学習用のコードだけを入力してください。</p></section>
      <button class="reset" id="clearProgress">学習の記録をリセット</button>
    </aside>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
(()=>{
const lessons=[
 {name:'最初のプログラム',tag:'はじめの一歩',title:'Rustで、はじめまして。',intro:'Rustのプログラムを動かしてみよう。まずは画面に挨拶を表示します。',concept:'プログラムは <code>fn main() { ... }</code> から始まります。<code>println!</code> は文字を表示する命令です。行の最後には <code>;</code> を付けます。',task:'コードを書いて実行し、「こんにちは、Rust！」と表示させよう。',goal:'表示結果: こんにちは、Rust！',hint:'fn main() {\n    println!("こんにちは、Rust！");\n}',takeaway:'Rustのプログラムは <code>main</code> 関数から動き始める。<code>println!</code> は実行するたびに改行して表示する。',starter:'fn main() {\n    // この下に書いてみよう\n\n}\n',expected:'こんにちは、Rust！'},
 {name:'複数行の表示',tag:'命令を重ねる',title:'2行のメッセージを出そう。',intro:'命令を上から順に並べると、その順番で実行されます。表示命令をもうひとつ足してみよう。',concept:'<code>println!</code> は一度呼ぶと1行表示して改行します。何行でも続けて書けます。',task:'「Rustを勉強中！」の次の行に「少しずつ覚えよう！」を表示しよう。',goal:'2つのメッセージが別々の行に出る',hint:'println!("Rustを勉強中！");\nprintln!("少しずつ覚えよう！");',takeaway:'命令は上から順に実行される。日本語もそのまま文字列として表示できる。',starter:'fn main() {\n    println!("Rustを勉強中！");\n    // 次の行を追加しよう\n}\n',expected:'Rustを勉強中！\n少しずつ覚えよう！'},
 {name:'値を埋め込む',tag:'文字列と値',title:'{}に値を入れてみよう。',intro:'文章の一部をあとから決めたいときは、文字列の中に場所を作って値を渡せます。',concept:'文字列の <code>{}</code> は値を差し込む場所です。カンマの後ろに渡した値が、左から順に入ります。',task:'変数 <code>name</code> の値を使い、「こんにちは、Rust！」と表示しよう。',goal:'こんにちは、Rust！',hint:'let name = "Rust";\nprintln!("こんにちは、{}！", name);',takeaway:'<code>{}</code> を使うと、変数の値を文章に差し込める。',starter:'fn main() {\n    let name = "Rust";\n    // nameを使って挨拶しよう\n\n}\n',expected:'こんにちは、Rust！'},
 {name:'数と計算',tag:'整数と計算',title:'数字を計算して表示しよう。',intro:'数字も変数に入れて使えます。Rustは整数どうしの計算も得意です。',concept:'<code>let days = 3;</code> のように整数を入れられます。<code>+</code> は足し算で、結果も変数に保存できます。',task:'3に2を足した値を <code>days</code> に入れ、「5日目です！」と表示しよう。',goal:'出力に 5日目です！ が含まれる',hint:'let start = 3;\nlet days = start + 2;\nprintln!("{}日目です！", days);',takeaway:'整数は <code>+</code> や <code>-</code> で計算できる。Rustは値を見て型を推測する。',starter:'fn main() {\n    let start = 3;\n    // startに2を足してdaysに入れよう\n\n}\n',expected:'5日目です！'},
 {name:'変数を書き換える',tag:'mutキーワード',title:'変数の値を更新しよう。',intro:'Rustの変数は、作ったあとに値を変えるかどうかを明示します。値を更新する方法を試そう。',concept:'<code>let</code> で作った変数は基本的に変更できません。変更したいときは <code>let mut</code> と書きます。',task:'<code>score</code> を10で作り、あとから15にして表示しよう。',goal:'出力: スコアは15',hint:'let mut score = 10;\nscore = 15;\nprintln!("スコアは{}", score);',takeaway:'値を変える必要がある変数には <code>mut</code> を付ける。変更しない値には付けなくてよい。',starter:'fn main() {\n    // scoreを変更できる変数として作ろう\n\n    // 値を15に更新しよう\n\n    println!("スコアは{}", score);\n}\n',expected:'スコアは15'},
 {name:'条件で分ける',tag:'if式',title:'条件によって表示を変えよう。',intro:'条件が合うかどうかで、実行する処理を選べます。Rustのifを使ってみよう。',concept:'<code>if 条件 { ... } else { ... }</code> で処理を分けます。条件には <code>true</code> または <code>false</code> になる式を書きます。',task:'<code>score</code> が10以上なら「合格！」、そうでなければ「もう一度！」と表示しよう。scoreは12です。',goal:'出力: 合格！',hint:'let score = 12;\nif score >= 10 {\n    println!("合格！");\n} else {\n    println!("もう一度！");\n}',takeaway:'<code>if</code> の条件が真なら最初のブロック、偽なら <code>else</code> のブロックが実行される。',starter:'fn main() {\n    let score = 12;\n    // scoreが10以上かをifで調べよう\n\n}\n',expected:'合格！'}
];
const $=id=>document.getElementById(id),storageKey='rust-small-class-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch{}let current=Math.min(Math.max(Number(saved.current)||0,0),lessons.length-1),done=new Set(saved.done||[]),isRunning=false;
function persist(){try{localStorage.setItem(storageKey,JSON.stringify({current,done:[...done]}))}catch{}}
function renderList(){const list=$('lessonList');list.replaceChildren();lessons.forEach((l,i)=>{const b=document.createElement('button');b.className='lesson-link'+(current===i?' active':'')+(done.has(i)?' done':'');b.innerHTML=`<span class="step-no">${done.has(i)?'✓':String(i+1).padStart(2,'0')}</span><span class="lesson-name">${l.name}</span>`;b.title=`${String(i+1).padStart(2,'0')} · ${l.name}`;b.setAttribute('aria-label',`レッスン${i+1}: ${l.name}`);b.onclick=()=>selectLesson(i);list.append(b)})}
function updateProgress(){const n=done.size,p=Math.round(100*n/lessons.length);$('topProgress').textContent=`${n} / ${lessons.length} 完了`;$('sideCount').textContent=`${n} / ${lessons.length}`;$('progressFill').style.width=p+'%'}
function selectLesson(i){current=i;persist();renderLesson()}
function renderLesson(){const l=lessons[current];$('eyebrow').textContent=`LESSON ${String(current+1).padStart(2,'0')} · ${l.tag}`;$('headline').textContent=l.title;$('intro').textContent=l.intro;$('concept').innerHTML=l.concept;$('taskText').innerHTML=l.task;$('goalText').innerHTML=l.goal;$('takeaway').innerHTML=l.takeaway;$('hintText').textContent=l.hint;$('hintText').classList.remove('show');$('hintBtn').textContent='ヒントを見る　＋';$('code').value=saved['code'+current]??l.starter;updateGutter();$('prevBtn').disabled=current===0;$('nextBtn').textContent=current===lessons.length-1?(done.size===lessons.length?'最初から復習':'最後のレッスン'):'次のレッスン →';$('nextBtn').disabled=current===lessons.length-1&&done.size<lessons.length;renderList();updateProgress();resetConsole()}
function updateGutter(){const n=$('code').value.split('\n').length;$('gutter').textContent=Array.from({length:n},(_,i)=>i+1).join('\n')}
function resetConsole(){ $('output').className='console-body placeholder';$('output').textContent='ここにプログラムの出力やエラーが表示されます。';$('stateText').textContent='まだ実行していません';$('stateDot').style.background='#62687b'}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1900)}
async function run(){if(isRunning)return;const source=$('code').value;const btn=$('runBtn');isRunning=true;btn.disabled=true;btn.innerHTML='<span>◌</span> 実行中…';$('stateText').textContent='Rust Playgroundで実行中';$('stateDot').style.background='#c4b5fd';$('output').className='console-body placeholder';$('output').textContent='コンパイルして実行しています…';try{const response=await fetch('https://play.rust-lang.org/execute',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel:'stable',mode:'debug',edition:'2024',crateType:'bin',tests:false,code:source,backtrace:false})});if(!response.ok)throw new Error(`実行サービスが応答しませんでした (${response.status})`);const result=await response.json();if(result.error)throw new Error(result.error);const succeeded=result.success!==false&&(result.code==null||result.code===0);if(!succeeded){$('output').className='console-body error';$('output').textContent=(result.stderr||'コンパイルまたは実行に失敗しました').trim();$('stateText').textContent='コンパイルエラー';$('stateDot').style.background='#ff8795';return}const out=(result.stdout||'').replace(/\n$/,'');const logs=(result.stderr||'').trim();$('output').className='console-body'+(out===lessons[current].expected?' success':'');$('output').textContent=(out||'(出力なし)')+(logs?'\n\n[コンパイル・実行ログ]\n'+logs:'');if(out===lessons[current].expected){$('stateText').textContent='実行できました · お題クリア！';$('stateDot').style.background='#a6f1ce';done.add(current);persist();renderList();updateProgress();toast('できた！レッスンクリア 🎉')}else{$('stateText').textContent='実行できました';$('stateDot').style.background='#c4b5fd'}}catch(err){$('output').className='console-body error';$('output').textContent='実行できませんでした。インターネット接続を確認してください。\n'+err.message;$('stateText').textContent='実行に失敗';$('stateDot').style.background='#ff8795'}finally{isRunning=false;btn.disabled=false;btn.innerHTML='<span>▶</span> 実行して確認'}}
$('code').addEventListener('input',()=>{updateGutter();saved['code'+current]=$('code').value;persist()});$('code').addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='Enter'){e.preventDefault();run()}if(e.key==='Tab'){e.preventDefault();const a=e.target,s=a.selectionStart,end=a.selectionEnd;a.value=a.value.slice(0,s)+'    '+a.value.slice(end);a.selectionStart=a.selectionEnd=s+4;a.dispatchEvent(new Event('input'))}});
$('runBtn').onclick=run;$('prevBtn').onclick=()=>selectLesson(Math.max(0,current-1));$('nextBtn').onclick=()=>{if(current===lessons.length-1){if(done.size===lessons.length)selectLesson(0)}else selectLesson(current+1)};$('resetCodeBtn').onclick=()=>{$('code').value=lessons[current].starter;$('code').dispatchEvent(new Event('input'));resetConsole()};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('code').value);toast('コードをコピーしました')}catch{toast('コピーできませんでした')}};$('hintBtn').onclick=()=>{const h=$('hintText'),show=!h.classList.contains('show');h.classList.toggle('show',show);$('hintBtn').textContent=show?'ヒントを閉じる　−':'ヒントを見る　＋'};$('clearProgress').onclick=()=>{if(confirm('学習の記録と保存したコードを消しますか？')){localStorage.removeItem(storageKey);saved={};done.clear();current=0;renderLesson();toast('記録をリセットしました')}};
renderLesson();
})();
</script>
